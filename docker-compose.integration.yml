services:
  db-migrate:
    environment: !override
      DATABASE_URL: "postgres://integration:integration-password@postgres:5432/mdcms_integration_test"
      NODE_ENV: "test"
      LOG_LEVEL: "error"
    ports: !override []
  server:
    environment: !override
      DATABASE_URL: "postgres://integration:integration-password@postgres:5432/mdcms_integration_test"
      NODE_ENV: "test"
      LOG_LEVEL: "error"
      PORT: "4000"
      REDIS_URL: "redis://redis:6379"
      S3_ENDPOINT: "http://minio:9000"
      S3_ACCESS_KEY: "integration"
      S3_SECRET_KEY: "integration-password"
      S3_BUCKET: "integration-test"
      S3_PUBLIC_BASE_URL: "http://127.0.0.1:${INTEGRATION_MINIO_PORT}/integration-test"
      SMTP_HOST: "mailhog"
      SMTP_PORT: "1025"
      MDCMS_SERVER_URL: "http://127.0.0.1:${INTEGRATION_SERVER_PORT}"
      MDCMS_STUDIO_ALLOWED_ORIGINS: "http://127.0.0.1:${INTEGRATION_SERVER_PORT}"
      MDCMS_COLLAB_ALLOWED_ORIGINS: "http://127.0.0.1:${INTEGRATION_SERVER_PORT}"
      AI_PROVIDER: ""
      AI_MODEL: ""
      GROQ_API_KEY: ""
      GROQ_BASE_URL: ""
      ANTHROPIC_API_KEY: ""
      ANTHROPIC_BASE_URL: ""
    ports: !override
      - "127.0.0.1:${INTEGRATION_SERVER_PORT}:4000"
  postgres:
    environment: !override
      POSTGRES_USER: "integration"
      POSTGRES_PASSWORD: "integration-password"
      POSTGRES_DB: "mdcms_integration_test"
    ports: !override
      - "127.0.0.1:${INTEGRATION_POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integration -d mdcms_integration_test"]
  redis:
    volumes:
      - redisdata:/data
    environment: !override {}
    ports: !override
      - "127.0.0.1:${INTEGRATION_REDIS_PORT}:6379"
  minio:
    environment: !override
      MINIO_ROOT_USER: "integration"
      MINIO_ROOT_PASSWORD: "integration-password"
    ports: !override
      - "127.0.0.1:${INTEGRATION_MINIO_PORT}:9000"
      - "127.0.0.1:${INTEGRATION_MINIO_CONSOLE_PORT}:9001"
  minio-init:
    environment: !override
      S3_ENDPOINT: "http://minio:9000"
      S3_ACCESS_KEY: "integration"
      S3_SECRET_KEY: "integration-password"
      S3_BUCKET: "integration-test"
    ports: !override []
  mailhog:
    environment: !override {}
    ports: !override
      - "127.0.0.1:${INTEGRATION_SMTP_PORT}:1025"
      - "127.0.0.1:${INTEGRATION_MAILHOG_PORT}:8025"

volumes:
  redisdata:
